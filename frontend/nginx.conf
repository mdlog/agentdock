server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths fall back to the SPA shell so a refresh
    # on /onchain, /hire/<id> or /tasks/<id> does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted static assets; never cache the shell.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
